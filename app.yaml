runtime: nodejs20
env: standard
instance_class: F1

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 5

handlers:
  - url: /_next/static
    static_dir: .next/static
    expiration: "365d"

  - url: /.*
    secure: always
    script: auto

env_variables:
  NODE_ENV: "production"
