# Google Cloud Build Pipeline for Legal.ai
# Builds, tests, containerizes, and deploys the Next.js assistant to Google Cloud Run.
steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    id: 'install-dependencies'

  # 2. Run automated test suites (55 tests)
  - name: 'node:20'
    entrypoint: npm
    args: ['test']
    id: 'run-automated-tests'

  # 3. Build optimized production container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/legal-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/legal-ai:latest'
      - '.'
    id: 'build-container-image'

  # 4. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/legal-ai:$COMMIT_SHA']
    id: 'push-image'

  # 5. Deploy to Google Cloud Run (Serverless, Auto-Scaling)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legal-ai'
      - '--image=gcr.io/$PROJECT_ID/legal-ai:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--set-env-vars=NODE_ENV=production'
    id: 'deploy-to-cloud-run'

images:
  - 'gcr.io/$PROJECT_ID/legal-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/legal-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
