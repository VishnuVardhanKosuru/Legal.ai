name: CI/CD & Google Cloud Run Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Execute Automated Test Suites (55 tests)
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_TELEMETRY_DISABLED: 1

  deploy-gcp:
    name: Deploy to Google Cloud Run
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: env.GCP_SA_KEY != ''

      - name: Build and Push Docker Image
        if: env.GCP_SA_KEY != ''
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/legal-ai:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/legal-ai:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud run deploy legal-ai \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/legal-ai:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
